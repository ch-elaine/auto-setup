# Default kernel. @ROOT_UUID@ is filled in by arch-install.sh.
# Microcode needs no initrd line: mkinitcpio's "microcode" hook embeds it.
# zswap.enabled=1: the Gaming wiki asks for zswap; linux-zen ships it disabled.
title   Arch Linux (linux-zen)
linux   /vmlinuz-linux-zen
initrd  /initramfs-linux-zen.img
options root=UUID=@ROOT_UUID@ rootflags=subvol=@ rw zswap.enabled=1
