# OBS profile: 1080p60, recorded as MP4 to ~/Videos, encoded on the GPU (VA-API H.264).
# @HOME@ is filled in by arch-install.sh. Anything not listed keeps OBS's default, and
# the VA-API device is left unset so OBS picks the GPU from /dev/dri/by-path itself.
# The scene (scenes/Untitled.json) is a full-screen PipeWire screen capture.
[General]
Name=Untitled

[Output]
Mode=Advanced

[AdvOut]
Encoder=ffmpeg_vaapi_tex
RecEncoder=ffmpeg_vaapi_tex
RecFilePath=@HOME@/Videos
RecFormat2=mp4

[Video]
BaseCX=1920
BaseCY=1080
OutputCX=1920
OutputCY=1080
FPSCommon=60
