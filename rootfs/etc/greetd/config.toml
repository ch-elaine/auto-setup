# Login screen: greetd runs tuigreet on tty1; logging in starts Hyprland.
# tuigreet remembers the last user; F3 lists other sessions, F12 = shutdown/reboot.
[terminal]
vt = 1

[default_session]
command = "tuigreet --time --remember --asterisks --theme 'border=blue;prompt=blue;button=blue' --cmd start-hyprland"
user = "greeter"
