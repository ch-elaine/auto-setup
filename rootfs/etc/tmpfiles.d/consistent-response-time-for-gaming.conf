# sysfs part of ArchWiki "Gaming" → response-time consistency, applied at boot.
# "w-" instead of the wiki's "w": a knob a newer kernel dropped is skipped
# instead of making systemd-tmpfiles fail.
#
# Deliberate deviation for CS2: the wiki turns transparent hugepages (THP) off
# but warns this costs a lot in TCMalloc games (Dota 2, CS — Source engine).
# THP stays on with TCMalloc's recommended settings: no allocation stalls
# (defer+madvise) and no memory bloat (max_ptes_none = 0).
w- /sys/kernel/mm/lru_gen/enabled - - - - 5
w- /sys/kernel/mm/transparent_hugepage/enabled - - - - always
w- /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
w- /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 0
w- /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - never
w- /proc/sys/kernel/sched_child_runs_first - - - - 0
w- /proc/sys/kernel/sched_autogroup_enabled - - - - 1
w- /proc/sys/kernel/sched_cfs_bandwidth_slice_us - - - - 3000
w- /sys/kernel/debug/sched/base_slice_ns - - - - 3000000
w- /sys/kernel/debug/sched/migration_cost_ns - - - - 500000
w- /sys/kernel/debug/sched/nr_migrate - - - - 8

# "performance" CPU governor at all times (idle cores still sleep)
w- /sys/devices/system/cpu/cpu*/cpufreq/scaling_governor - - - - performance
