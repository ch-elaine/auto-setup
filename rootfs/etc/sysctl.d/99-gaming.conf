# ArchWiki "Gaming", sized for Ryzen 5 7500F / 32 GB RAM.

# Game compatibility: don't slow down games that use split locks
kernel.split_lock_mitigate = 0

# Response-time consistency ("Make the changes permanent" section).
# Reserving 1 GiB + 5 % watermarks is safe with 32 GB (wiki limit: 5 % of RAM).
vm.compaction_proactiveness = 0
vm.watermark_boost_factor = 1
vm.min_free_kbytes = 1048576
vm.watermark_scale_factor = 500
vm.swappiness = 10
vm.zone_reclaim_mode = 0
vm.page_lock_unfairness = 1
